name: Upstream Repository Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"  # 每日 UTC 0 点执行
  workflow_dispatch:

jobs:
  upstream-sync:
    name: Synchronize with Upstream
    runs-on: ubuntu-latest
    if: github.event.repository.fork == true
    timeout-minutes: 15

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整提交历史
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize with Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: jxxghp/MoviePilot
          upstream_sync_branch: v2
          target_sync_branch: v2
          # 根据官方文档保留有效参数
          git_config_user: "GitHub Actions"
          git_config_email: "actions@github.com"
          git_config_pull_rebase: "false"

      - name: Error Handler
        if: failure()
        run: |
          echo "::error::Sync failed! Please check conflicts or manually sync."
          echo "建议解决方案："
          echo "1. 检查上游仓库变更是否导致冲突"
          echo "2. 手动执行 git pull https://github.com/jxxghp/MoviePilot v2"
          echo "3. 解决冲突后强制推送: git push --force"
